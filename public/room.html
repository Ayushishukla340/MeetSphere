<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>MeetSphere Room</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌐%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css"><script src="/socket.io/socket.io.js"></script></head><body>
<div class="lobby" id="lobby"><div class="lcard">
<div class="pv nocam" id="pvbox"><video id="pv" autoplay playsinline muted></video><div class="av"><b id="pvl">?</b></div>
<div class="pvc"><button class="cb" id="lmic">🎤</button><button class="cb" id="lcam">📷</button></div></div>
<div class="linfo"><h2>Ready to join?</h2><p class="mut">Meeting code: <b id="code" style="color:var(--b)"></b></p><p class="mut">Joining as <b id="lname"></b></p>
<p id="lmsg" class="mut" style="min-height:2.6em"></p>
<button class="btn" id="joinBtn" disabled>Join now</button><button class="btn ghost" id="retry">🔄 Retry camera / mic</button><a href="/" class="btn ghost">← Back to home</a></div></div></div>

<div class="app hide" id="call"><div class="main">
<div class="top"><span class="logo" style="font-size:1.1rem">🌐 Meet<span class="grad">Sphere</span></span>
<span class="pill cp" id="codeBtn" title="Copy invite link">📋 <span id="topcode"></span></span><span class="pill" id="timer">00:00</span><span class="pill lock">🔒 Encrypted</span><span class="pill" id="conn" style="color:#ffb3c0">Reconnecting…</span></div>
<div class="stage"><div class="grid" id="grid"></div>
<div id="boardWrap" class="hide"><canvas id="board"></canvas><div class="tools"><input type="color" id="col" value="#7c5cff"><input type="range" id="wd" min="1" max="24" value="3" style="width:90px;margin:0"><button id="er">Eraser</button><button id="clr">Clear all</button><button id="dl">⬇ PNG</button></div></div></div>
<div class="bar">
<button class="cb" id="mic" title="Mute / unmute"><span>🎤</span><span class="lb">Mic</span></button>
<button class="cb" id="cam" title="Camera on / off"><span>📷</span><span class="lb">Camera</span></button>
<button class="cb" id="scr" title="Share your screen"><span>🖥️</span><span class="lb">Share</span></button>
<button class="cb" id="wb" title="Whiteboard"><span>🎨</span><span class="lb">Board</span></button>
<button class="cb" id="hand" title="Raise hand"><span>✋</span><span class="lb">Hand</span></button>
<button class="cb" id="chatB" title="Chat"><span>💬</span><span class="lb">Chat</span><span class="bd hide" id="bd">0</span></button>
<button class="cb" id="ppl" title="People"><span>👥</span><span class="lb">People</span></button>
<button class="cb end" id="end" title="Leave the meeting"><span>📞</span><span class="lb">Leave</span></button></div></div>
<aside class="side hide" id="side"><div class="shead"><button class="cb sm" id="sideClose" title="Close (Esc)" aria-label="Close panel">←</button><b id="stitle">Chat</b><button class="cb sm" id="sideX" aria-label="Close panel" title="Close">✕</button></div>
<div class="stabs"><button id="tabChat" class="on">Chat</button><button id="tabPeople">People (<span id="pcount">0</span>)</button></div>
<div class="panel" id="chatP"><div id="msgs"></div><div class="sf"><input id="txt" placeholder="Type a message…" maxlength="2000" autocomplete="off" enterkeyhint="send"><div class="row"><button class="btn" style="flex:1" id="send">Send</button><button class="btn ghost" id="fbtn">📎 File</button></div><input type="file" id="file" class="hide"></div></div>
<div class="panel hide" id="peopleP"><div id="plist"></div><div class="pinfo"><div class="mut">Meeting code</div><b id="pcode" style="font-size:1.3rem;color:var(--b)"></b><div class="row" style="justify-content:center"><button class="btn ghost sm" id="cpc">Copy code</button><button class="btn ghost sm" id="cpl">Copy link</button></div></div></div></aside></div>

<div class="modal hide" id="leaveDlg"><div class="card"><h3 style="margin-bottom:8px">Leave the meeting?</h3><p class="mut" id="leaveTxt" style="margin-bottom:16px"></p>
<div style="display:grid;gap:10px"><button class="btn red" id="leaveBtn">Leave meeting</button><button class="btn red ghost hide" id="endAll">End meeting for everyone</button><button class="btn ghost" id="stayBtn">Stay in meeting</button></div></div></div>
<script src="common.js"></script><script src="room.js"></script></body></html>
